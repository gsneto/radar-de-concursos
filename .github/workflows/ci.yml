name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (unittest)
    # Windows: há testes específicos de notificação nativa e caminhos do Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Node é usado pelos testes funcionais do JS da UI legada (tests/test_ui.py).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      # Testes que dependem da base real em data/ (fora do Git) se pulam sozinhos.
      - run: python -m unittest discover -s tests -t .

  web-react:
    name: Frontend React (tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      # O dist/ é versionado; falha se alguém mudou o frontend sem rebuildar.
      - name: dist/ versionado está atualizado
        run: git diff --exit-code --stat -- dist
